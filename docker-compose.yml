version: '3.8'
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leadsdb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  app:
    build: .
    environment:
      - DB_TYPE=postgres
      - DATABASE_URL=postgres://postgres:postgres@db:5432/leadsdb
      - PORT=3000
    depends_on:
      - db
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
    command: sh -c "npm install && npm run seed && npm start"
    restart: unless-stopped
volumes:
  db_data:
